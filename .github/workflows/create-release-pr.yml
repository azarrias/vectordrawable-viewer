name: Create Release PR

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version tag (e.g., v0.1.0). Leave empty if using bump."
        required: false
      bump:
        description: "Semantic version bump: major, minor, or patch"
        required: false

jobs:
  create-release-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Determine version
        id: versioning
        run: |
          CURRENT_VERSION=$(jq -r '.version' package.json)

          if [ -n "${{ github.event.inputs.version }}" ]; then
            NEW_VERSION="${{ github.event.inputs.version }}"
          else
            PART="${{ github.event.inputs.bump }}"
            if [ "$PART" = "major" ]; then
              NEW_VERSION="v$(npm version major --no-git-tag-version | sed 's/^v//')"
            elif [ "$PART" = "minor" ]; then
              NEW_VERSION="v$(npm version minor --no-git-tag-version | sed 's/^v//')"
            elif [ "$PART" = "patch" ]; then
              NEW_VERSION="v$(npm version patch --no-git-tag-version | sed 's/^v//')"
            else
              echo "ERROR: You must specify either version or bump."
              exit 1
            fi
          fi

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Validate changelog entry exists
        run: |
          RAW_VERSION=$(echo "${{ steps.versioning.outputs.new_version }}" | sed 's/^v//')
          if ! grep -q "## $RAW_VERSION" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md does not contain section: ## $RAW_VERSION"
            exit 1
          fi

      - name: Create release branch
        run: |
          RAW_VERSION=$(echo "${{ steps.versioning.outputs.new_version }}" | sed 's/^v//')
          BRANCH="release/$RAW_VERSION"
          git checkout -b "$BRANCH"

      - name: Update package.json version
        run: |
          RAW_VERSION=$(echo "${{ steps.versioning.outputs.new_version }}" | sed 's/^v//')
          jq ".version = \"$RAW_VERSION\"" package.json > package.tmp.json
          mv package.tmp.json package.json

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add package.json
          git commit -m "Prepare release ${{ steps.versioning.outputs.new_version }}"

      - name: Push branch
        run: |
          RAW_VERSION=$(echo "${{ steps.versioning.outputs.new_version }}" | sed 's/^v//')
          BRANCH="release/$RAW_VERSION"
          git push origin "$BRANCH"

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          title: "Release ${{ steps.versioning.outputs.new_version }}"
          body: "Automated release PR for version ${{ steps.versioning.outputs.new_version }}."
          base: main
          head: release/${{ steps.versioning.outputs.new_version }}
